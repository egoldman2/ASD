server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # HTMX redirects preserve each feature's own origin, styles and scripts.
    location ~ ^/navigate/(800[1-5])$ {
        add_header HX-Redirect http://localhost:$1 always;
        add_header Cache-Control "no-store" always;
        return 204;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
