worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;

        location = /health {
            default_type text/plain;
            return 200 "order-returns-frontend\n";
        }

        location = /_authenticated_session {
            internal;
            proxy_pass http://ethan-backend:6002/api/session;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
        }

        location @account_login {
            return 302 http://localhost:8003/index.html?return_url=http%3A%2F%2Flocalhost%3A8004%2F;
        }

        location / {
            auth_request /_authenticated_session;
            error_page 401 403 = @account_login;
            try_files $uri $uri/ =404;
        }
    }
}
