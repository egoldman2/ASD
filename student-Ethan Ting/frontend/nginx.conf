server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin, administrator-only HTMX fragment. Existing JSON APIs stay unchanged.
    location = /api/admin/assistant/service-status {
        proxy_pass http://ethan-backend:6002;
        proxy_connect_timeout 3s;
        proxy_read_timeout 8s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store" always;
    }

    location / {
        # Revalidate after a rebuild instead of showing an older admin page.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
