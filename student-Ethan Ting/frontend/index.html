<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Sign In | ASD 2026</title>

    <link rel="icon" href="data:,">
    <link
      rel="stylesheet"
      href="http://localhost:8000/css/styles.css?v=12"
    >
    <link rel="stylesheet" href="css/login.css?v=4">

    <script src="http://localhost:8000/js/site-header.js?v=4" defer></script>
    <script src="http://localhost:8000/js/account-menu.js?v=6" defer></script>
    <script src="js/login.js?v=6" defer></script>
  </head>

  <body>
    <header class="navbar appleNav" data-site-header data-active="account"></header>

    <main class="loginPage">
      <section class="loginCard">
        <div id="loginPanel">
          <h1 id="loginTitle">Sign in to your account</h1>

          <p class="loginDescription">
            Enter your account details to continue.
          </p>

          <form id="loginForm" class="loginForm">
            <div class="formField">
              <label for="loginEmail">Email address</label>

              <input
                id="loginEmail"
                name="email"
                type="email"
                autocomplete="username"
                required
              >
            </div>

            <div class="formField">
              <label for="loginPassword">Password</label>

              <input
                id="loginPassword"
                name="password"
                type="password"
                autocomplete="current-password"
                required
              >
            </div>

            <button id="loginButton" class="authSubmitButton" type="submit">
              Sign in
            </button>

            <p
              id="loginMessage"
              class="loginMessage"
              aria-live="polite"
            ></p>
          </form>
        </div>

        <div id="registerPanel" hidden>
          <h1 id="registerTitle">Create your account</h1>

          <p class="loginDescription">
            Register as a customer to manage your profile and use shopping features.
          </p>

          <form id="registerForm" class="loginForm">
            <div class="formField">
              <label for="registerName">Full name</label>
              <input
                id="registerName"
                name="full_name"
                type="text"
                maxlength="100"
                autocomplete="name"
                required
              >
            </div>

            <div class="formField">
              <label for="registerEmail">Email address</label>
              <input
                id="registerEmail"
                name="email"
                type="email"
                maxlength="254"
                autocomplete="email"
                required
              >
            </div>

            <div class="formField">
              <label for="registerPassword">Password</label>
              <input
                id="registerPassword"
                name="password"
                type="password"
                minlength="8"
                autocomplete="new-password"
                required
              >
              <small>Use at least 8 characters.</small>
            </div>

            <div class="formField">
              <label for="registerPasswordConfirmation">Confirm password</label>
              <input
                id="registerPasswordConfirmation"
                name="password_confirmation"
                type="password"
                minlength="8"
                autocomplete="new-password"
                required
              >
            </div>

            <button id="registerButton" class="authSubmitButton" type="submit">
              Create account
            </button>

            <p
              id="registerMessage"
              class="loginMessage"
              aria-live="polite"
            ></p>
          </form>
        </div>
      </section>
    </main>

    <footer class="footer">
      asd(2026)-group7
    </footer>
  </body>
</html>
