<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Account | ASD 2026</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="http://localhost:8000/css/styles.css?v=12">
    <link rel="stylesheet" href="css/dashboard.css?v=4">
    <script src="http://localhost:8000/js/site-header.js?v=3" defer></script>
    <script src="http://localhost:8000/js/account-menu.js?v=6" defer></script>
    <script src="js/customer.js?v=3" defer></script>
  </head>

  <body>
    <header class="navbar appleNav" data-site-header data-active="account">
      <div class="navContainer">
        <div class="navLogo">
          <a href="http://localhost:8000" class="logoLink">
            <span class="logoMain">ASD 2026</span>
          </a>
        </div>

        <button class="mobileMenuButton" type="button" aria-controls="mainNavigation" aria-expanded="false" data-mobile-menu-trigger>
          <span class="mobileMenuButtonBar" aria-hidden="true"></span>
          <span class="mobileMenuButtonBar" aria-hidden="true"></span>
          <span class="visuallyHidden">Menu</span>
        </button>

        <nav id="mainNavigation" class="navLinks" aria-label="Main navigation">
          <a href="http://localhost:8001" class="navLink">Catalogue</a>
          <a href="http://localhost:8005" class="navLink">Support</a>
          <a href="http://localhost:8001" class="navLink navSearchLink" aria-label="Search products">
            <svg class="navSearchIcon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="10.5" cy="10.5" r="6.5"></circle>
              <path d="m15.5 15.5 5 5"></path>
            </svg>
            <span class="navSearchLabel">Search</span>
          </a>
          <div class="accountMenu" data-account-menu>
            <button
              class="navLink accountMenuButton active"
              type="button"
              aria-expanded="false"
              aria-haspopup="true"
              data-account-trigger
            >
              <span class="accountMenuIcon" aria-hidden="true"></span>
              <span>Account</span>
            </button>
            <div class="accountMenuPanel" aria-label="Account options">
              <div class="accountMenuHeader">
                <p class="accountMenuWelcome" data-account-welcome>Welcome to ASD 2026</p>
                <div class="accountMenuActions">
                  <a class="accountMenuAction accountMenuActionPrimary" href="index.html" data-account-sign-in>Sign in</a>
                  <a class="accountMenuAction accountMenuActionSecondary" href="?view=register" data-account-register>Create account</a>
                  <a class="accountMenuAction accountMenuActionPrimary" href="customer.html" data-account-primary hidden>My account</a>
                  <button class="accountMenuAction accountMenuActionSecondary" type="button" data-account-logout hidden>Log out</button>
                </div>
              </div>
              <div class="accountMenuLinks">
                <a class="accountMenuItem" href="customer.html" data-account-profile>
                  <svg class="accountMenuItemIcon" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="7" r="4"></circle>
                    <path d="M4.5 21c.8-5 3.3-7 7.5-7s6.7 2 7.5 7"></path>
                  </svg>
                  <span>My account</span>
                </a>
                <a class="accountMenuItem" href="http://localhost:8004">
                  <svg class="accountMenuItemIcon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 7h16v14H4z"></path>
                    <path d="M7 3h10l3 4H4z"></path>
                  </svg>
                  <span>My orders</span>
                </a>
                <a class="accountMenuItem" href="http://localhost:8004">
                  <svg class="accountMenuItemIcon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 7h16v14H4z"></path>
                    <path d="M7 3h10l3 4H4z"></path>
                    <path d="M15 14H8m0 0 3-3m-3 3 3 3"></path>
                  </svg>
                  <span>My returns</span>
                </a>
              </div>
            </div>
          </div>
        </nav>
      </div>
    </header>

    <main class="dashboardPage customerPage">
      <section class="dashboardHero">
        <div>
          <h1 id="customerGreeting">Welcome</h1>
          <p class="dashboardDescription">
            Manage your profile and continue shopping from one simple account page.
          </p>
        </div>
      </section>

      <section class="dashboardGrid">
        <article class="dashboardPanel" aria-labelledby="profileTitle">
          <div class="panelHeading">
            <h2 id="profileTitle">Profile</h2>
          </div>

          <form id="profileForm" class="detailsForm">
            <div class="formField">
              <label for="profileName">Full name</label>
              <input id="profileName" name="full_name" type="text" required>
            </div>

            <div class="formField">
              <label for="profileEmail">Email address</label>
              <input id="profileEmail" name="email" type="email" required>
            </div>

            <div class="formActions">
              <button class="primaryButton" type="submit">Save changes</button>
            </div>
          </form>

          <p id="profileMessage" class="dashboardMessage" aria-live="polite"></p>
        </article>

      </section>
    </main>

    <footer class="footer">asd(2026)-group7</footer>
  </body>
</html>
