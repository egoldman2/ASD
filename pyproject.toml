[tool.ruff]
target-version = "py311"
extend-exclude = [
    ".aws-deployment",
    ".cloud-build",
    ".git",
    ".pytest_cache",
    ".venv",
    ".venv311",
    "venv",
]

[tool.ruff.lint]
select = ["S"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"docs/evidence/**" = ["S101", "S105", "S106"]
