AWSTemplateFormatVersion: '2010-09-09'
Description: Relay main pushes to a validated ephemeral GitHub Actions deployment using temporary CodeBuild credentials.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
Parameters:
  ConnectionArn:
    Type: String
    AllowedPattern: 'arn:aws:codeconnections:ap-southeast-2:[0-9]{12}:connection/[a-f0-9-]{36}'
  ApplicationStack:
    Type: String
    Default: asd-release2
    AllowedPattern: '[A-Za-z][A-Za-z0-9-]{0,127}'
  ReleaseBucketArn:
    Type: String
    AllowedPattern: 'arn:aws:s3:::[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]'
  InstanceId:
    Type: String
    AllowedPattern: 'i-([a-f0-9]{8}|[a-f0-9]{17})'
Resources:
  RunnerLogs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/codebuild/${AWS::StackName}'
      RetentionInDays: 7
  RunnerRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: temporary deployment credentials belong to a main-push build, never a public queued-job runner
        must: [one CodeBuild project only, no secret-reading or IAM permissions, one application's release bucket and SSM host only]
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: codebuild.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {aws:SourceAccount: !Ref 'AWS::AccountId'}
              ArnEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/${AWS::StackName}-deploy'
      Policies:
        - PolicyName: ValidatedMainDeployment
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [codeconnections:GetConnection, codeconnections:GetConnectionToken]
                Resource: !Ref ConnectionArn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${AWS::StackName}:*'
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${ReleaseBucketArn}/releases/*'
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript'
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${InstanceId}'
              - Effect: Allow
                Action: ssm:GetCommandInvocation
                Resource: '*' # This API does not support resource-level permissions.
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ApplicationStack}/*'
  RunnerProject:
    Type: AWS::CodeBuild::Project
    Metadata:
      com.aws.cloudformation.Context:
        why: API-started builds can use the Git helper that public webhook builds cannot use
        must: [no webhook on this deployment role, verify pinned runner digest, refuse every other job before its steps]
    Properties:
      Name: !Sub '${AWS::StackName}-deploy'
      ServiceRole: !GetAtt RunnerRole.Arn
      Artifacts: {Type: NO_ARTIFACTS}
      EncryptionKey: alias/aws/s3
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: false
      Source:
        Type: GITHUB
        Location: https://github.com/egoldman2/ASD
        GitCloneDepth: 1
        Auth: {Type: CODECONNECTIONS, Resource: !Ref ConnectionArn}
        BuildSpec: |
          version: 0.2
          env:
            git-credential-helper: yes
          phases:
            install:
              runtime-versions:
                python: 3.11
            build:
              commands:
                - python3 cloud/codebuild_runner.py run
      SourceVersion: main
      TimeoutInMinutes: 90
      QueuedTimeoutInMinutes: 30
      ConcurrentBuildLimit: 1
      LogsConfig:
        CloudWatchLogs: {Status: ENABLED, GroupName: !Ref RunnerLogs}
      Triggers:
        Webhook: false
  PushRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: public webhook builds only relay a verified main SHA and never receive deployment permissions
        must: [one push project trust, StartBuild on the one runner project only]
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: codebuild.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {aws:SourceAccount: !Ref 'AWS::AccountId'}
              ArnEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/${AWS::StackName}-push'
      Policies:
        - PolicyName: MainPushRelay
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [codeconnections:GetConnection, codeconnections:GetConnectionToken]
                Resource: !Ref ConnectionArn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${AWS::StackName}:*'
              - Effect: Allow
                Action: codebuild:StartBuild
                Resource: !GetAtt RunnerProject.Arn
  PushProject:
    Type: AWS::CodeBuild::Project
    Metadata:
      com.aws.cloudformation.Context:
        why: public GitHub webhook builds suppress the Git credential helper, so the fixed relay starts an API build
        must: [only main PUSH events, no execution of checkout code, compare checkout and remote main, no build overrides]
    Properties:
      Name: !Sub '${AWS::StackName}-push'
      ServiceRole: !GetAtt PushRole.Arn
      Artifacts: {Type: NO_ARTIFACTS}
      EncryptionKey: alias/aws/s3
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: false
      Source:
        Type: GITHUB
        Location: https://github.com/egoldman2/ASD
        GitCloneDepth: 1
        Auth: {Type: CODECONNECTIONS, Resource: !Ref ConnectionArn}
        BuildSpec: !Sub |
          version: 0.2
          phases:
            build:
              commands:
                - |
                  python3 - <<'PY'
                  import json, os, re, subprocess
                  sha = os.environ.get('CODEBUILD_RESOLVED_SOURCE_VERSION', '')
                  source = os.environ.get('CODEBUILD_SOURCE_VERSION')
                  head = os.environ.get('CODEBUILD_WEBHOOK_HEAD_REF')
                  if (not re.fullmatch(r'[a-f0-9]{40}', sha) or source not in {'main', sha}
                          or head not in {None, 'refs/heads/main'}
                          or (head is not None and os.environ.get('CODEBUILD_WEBHOOK_EVENT') != 'PUSH')):
                      raise SystemExit('Refusing an unexpected main push context.')
                  actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True, timeout=15).strip()
                  remote = subprocess.check_output(['git', 'ls-remote', 'https://github.com/egoldman2/ASD.git', 'refs/heads/main'],
                                                   text=True, timeout=20, env={**os.environ, 'GIT_TERMINAL_PROMPT': '0'}).split()
                  if actual != sha or not remote or remote[0] != sha:
                      raise SystemExit('Refusing a mismatched or superseded main checkout.')
                  started = subprocess.run(['aws', 'codebuild', 'start-build', '--project-name', '${AWS::StackName}-deploy',
                                            '--source-version', sha, '--region', 'ap-southeast-2', '--output', 'json'],
                                           check=True, capture_output=True, text=True, timeout=20)
                  build_id = json.loads(started.stdout)['build']['id']
                  print('Started main bootstrap: ' + build_id + ' for ' + sha)
                  PY
      SourceVersion: main
      TimeoutInMinutes: 5
      QueuedTimeoutInMinutes: 5
      ConcurrentBuildLimit: 1
      LogsConfig:
        CloudWatchLogs: {Status: ENABLED, GroupName: !Ref RunnerLogs}
      Triggers:
        Webhook: true
        FilterGroups:
          - - {Type: EVENT, Pattern: PUSH}
            - {Type: HEAD_REF, Pattern: '^refs/heads/main$'}
Outputs:
  ProjectName:
    Description: API-started project that hosts one admitted Actions job.
    Value: !Ref RunnerProject
  PushProjectName:
    Description: Main-push relay with no deployment permissions.
    Value: !Ref PushProject
  RoleArn:
    Description: Temporary service role; no AWS credentials are stored in GitHub.
    Value: !GetAtt RunnerRole.Arn
