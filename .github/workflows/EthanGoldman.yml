name: Ethan Goldman Customer Support CI

on:
  push:
    branches:
      - ethan-goldman
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ethan-goldman-customer-support-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Customer Support integration
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Ethan tests and shared regressions
        run: >-
          python -m pytest
          'student-Ethan Goldman/tests'
          student-Chufeng/tests
          'student-Ethan Ting/tests'
          student-Howard/tests
          -q

      - name: Compile application Python modules
        run: >-
          python -m compileall -q
          app.py
          'student-Ethan Goldman'
          student-Chufeng
          'student-Ethan Ting'
          student-Howard
          'student-Ryan Nolan'

  docker-build:
    name: Build and validate Customer Support services
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Customer Support test target
        run: >-
          docker build
          --file 'student-Ethan Goldman/Dockerfile'
          --target test
          --tag asd-customer-support-test:ci
          .

      - name: Run Customer Support test target
        run: docker run --rm asd-customer-support-test:ci

      - name: Build shared backend
        run: >-
          docker build
          --file shared/Dockerfile.backend
          --tag asd-shared-backend:ci
          .

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Start support and authentication services
        run: |
          docker compose up -d --build ethan-database ethan-backend customer-support-database
          docker compose up -d --build --no-deps customer-support-backend
          docker compose up -d --build --no-deps customer-support

      - name: Verify service health and database ownership
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:6002/health >/dev/null \
              && curl --fail --silent http://localhost:6005/health >/dev/null \
              && curl --fail --silent http://localhost:8005/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose ps
              exit 1
            fi
            sleep 2
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:6005/api/support/customer/tickets)" = "401"
          docker compose exec -T customer-support-backend test ! -e '/app/student-Ethan Goldman/database/support_tickets.db'
          docker compose exec -T customer-support-database test -f /data/support_tickets.db

      - name: Show integration logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=250 customer-support customer-support-backend customer-support-database ethan-backend ethan-database

      - name: Stop integration services
        if: always()
        run: docker compose down --volumes
