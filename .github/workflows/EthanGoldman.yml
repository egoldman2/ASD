name: Ethan Goldman Customer Support CI

env:
  AI_MODE_ENABLED: "false"
  MCP_ENABLED: "false"
  RAG_ENABLED: "false"
  RUN_LIVE_AI: "0"
  RUN_LIVE_MCP_AI: "0"
  RUN_LIVE_RAG_AI: "0"
  RUN_LIVE_VALIDATION: "0"
  RUN_LIVE_RELEASE1_VALIDATION: "0"
  OLLAMA_URL: "http://127.0.0.1:9"

on:
  push:
    branches:
      - main
      - ethan-goldman
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ethan-goldman-customer-support-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Customer Support integration
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            ai-services/rag_server/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r ai-services/rag_server/requirements.txt

      - name: Run Customer Support tests
        run: python -m pytest 'student-Ethan Goldman/tests' -q

      - name: Run shared MCP and RAG contract tests
        run: python -m pytest ai-services/mcp_server/tests ai-services/rag_server/tests -q

      - name: Run shared access and disabled-runtime checks
        run: python -m pytest shared/tests -q

      - name: Compile application Python modules
        run: python -m compileall -q 'student-Ethan Goldman' shared ai-services

  docker-build:
    name: Build and validate Customer Support services
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Customer Support test target
        run: >-
          docker build
          --file 'student-Ethan Goldman/Dockerfile'
          --target test
          --tag asd-customer-support-test:ci
          .

      - name: Run Customer Support test target
        run: >-
          docker run --rm
          --env AI_MODE_ENABLED --env MCP_ENABLED --env RAG_ENABLED
          --env RUN_LIVE_AI --env RUN_LIVE_MCP_AI --env RUN_LIVE_RAG_AI
          --env RUN_LIVE_VALIDATION --env RUN_LIVE_RELEASE1_VALIDATION
          --env OLLAMA_URL asd-customer-support-test:ci

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Confirm local AI services are disabled in CI
        run: |
          test "$AI_MODE_ENABLED" = "false"
          test "$MCP_ENABLED" = "false"
          test "$RAG_ENABLED" = "false"
          test "$RUN_LIVE_AI" = "0"

      - name: Start support and authentication services
        run: |
          docker compose up -d --build ethan-database ethan-backend customer-support-database
          docker compose up -d --build --no-deps customer-support-backend
          docker compose up -d --build --no-deps customer-support

      - name: Verify service health and database ownership
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:6002/health >/dev/null \
              && curl --fail --silent http://localhost:6005/health >/dev/null \
              && curl --fail --silent http://localhost:8005/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose ps
              exit 1
            fi
            sleep 2
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:6005/api/support/customer/tickets)" = "401"
          test "$(curl --fail --silent http://localhost:8005/js/htmx.min.js | sha256sum | cut -d ' ' -f 1)" = \
            "e209dda5c8235479f3166defc7750e1dbcd5a5c1808b7792fc2e6733768fb447"
          curl --fail --silent --cookie-jar /tmp/customer-support.cookies \
            --header 'Content-Type: application/json' \
            --data '{"email":"customer@asd.local","password":"CustomerPass!2026"}' \
            http://localhost:6002/api/login >/dev/null
          curl --fail --silent --cookie /tmp/customer-support.cookies \
            --output /tmp/customer-support-page.html \
            http://localhost:8005/customer.html
          grep -q 'src="js/htmx.min.js?v=2.0.4"' /tmp/customer-support-page.html
          curl --fail --silent --cookie /tmp/customer-support.cookies \
            --output /tmp/customer-support-tickets.json \
            http://localhost:8005/api/support/customer/tickets
          grep -q '"customer_user_id":"2"' /tmp/customer-support-tickets.json
          curl --fail --silent --cookie /tmp/customer-support.cookies \
            --header 'HX-Request: true' \
            --dump-header /tmp/customer-support-entry.headers \
            --output /dev/null \
            http://localhost:8005/api/support/ui/entry
          grep -qi '^HX-Redirect: /customer.html' /tmp/customer-support-entry.headers
          curl --fail --silent --cookie /tmp/customer-support.cookies \
            --header 'HX-Request: true' \
            --output /tmp/customer-support-dashboard.html \
            http://localhost:8005/api/support/ui/customer/dashboard
          grep -q 'Signed-in account' /tmp/customer-support-dashboard.html
          curl --fail --silent --cookie /tmp/customer-support.cookies \
            --header 'HX-Request: true' \
            --header 'Origin: http://localhost:8005' \
            --data-urlencode 'subject=CI HTMX integration' \
            --data-urlencode 'message=Created through the genuine Nginx and HTMX fragment route.' \
            --output /tmp/customer-support-create.html \
            http://localhost:8005/api/support/ui/customer/tickets
          grep -q 'Support ticket created' /tmp/customer-support-create.html
          curl --fail --silent --cookie-jar /tmp/customer-support-admin.cookies \
            --header 'Content-Type: application/json' \
            --data '{"email":"admin@asd.local","password":"AdminPass!2026"}' \
            http://localhost:6002/api/login >/dev/null
          docker compose exec -T customer-support-backend test ! -e '/app/student-Ethan Goldman/database/support_tickets.db'
          docker compose exec -T customer-support-database sh -c 'test -f "$DATABASE_PATH"'

      - name: Verify disabled AI, MCP and RAG through the frontend
        run: |
          docker compose exec -T customer-support-backend python -c 'import os; assert all(os.environ.get(key) == "false" for key in ("AI_MODE_ENABLED", "MCP_ENABLED", "RAG_ENABLED"))'
          python - <<'PY'
          import json
          from http.cookiejar import MozillaCookieJar
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          base = "http://localhost:8005"
          jar = MozillaCookieJar("/tmp/customer-support-admin.cookies")
          jar.load(ignore_discard=True, ignore_expires=True)
          cookie = next(item for item in jar if item.name == "ethan_session")
          headers = {"Cookie": "ethan_session=" + cookie.value, "Origin": base, "Content-Type": "application/json"}
          for path, payload, code in (
              ("/api/support/admin/mcp/tools", None, "MCP_DISABLED"),
              ("/api/support/admin/mcp/tools/call", {"tool": "ethan_goldman_get_queue_summary"}, "MCP_DISABLED"),
              ("/api/support/admin/mcp/assistant", {"question": "How does our support workload look?"}, "AI_DISABLED"),
              ("/api/support/admin/rag/answer", {"question": "What lengths are allowed for support ticket subjects?"}, "RAG_DISABLED"),
              ("/api/support/admin/tickets/2002/ai-analysis", {}, "AI mode is disabled."),
          ):
              request = Request(base + path, headers=headers, data=json.dumps(payload).encode() if payload is not None else None)
              try:
                  response = urlopen(request, timeout=10)
              except HTTPError as error:
                  response = error
              with response:
                  assert response.status == 503, (path, response.status)
                  error = json.load(response)["error"]
                  assert (error["code"] if isinstance(error, dict) else error) == code, path
              print(path, 503, code)
          with urlopen(Request(base + "/api/support/admin/tickets", headers=headers), timeout=10) as response:
              assert response.status == 200 and json.load(response)["tickets"]
          PY

      - name: Show integration logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=250 customer-support customer-support-backend customer-support-database ethan-backend ethan-database

      - name: Stop integration services
        if: always()
        run: docker compose down --volumes
