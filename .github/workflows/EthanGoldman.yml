name: Ethan Goldman Customer Support CI

on:
  push:
    branches:
      - ethan-goldman
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ethan-goldman-customer-support-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Customer Support integration
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Customer Support and shared regressions
        run: >-
          python -m pytest
          'student-Ethan Goldman/tests'
          student-Chufeng/tests
          -q

      - name: Compile Customer Support Python modules
        run: python -m compileall -q app.py 'student-Ethan Goldman'

  docker-build:
    name: Build and validate Customer Support services
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Customer Support frontend
        run: >-
          docker build
          --file 'student-Ethan Goldman/Dockerfile'
          --target frontend
          --tag asd-customer-support:ci
          .

      - name: Build Customer Support test target
        run: >-
          docker build
          --file 'student-Ethan Goldman/Dockerfile'
          --target test
          --tag asd-customer-support-test:ci
          .

      - name: Run Customer Support test target
        run: docker run --rm asd-customer-support-test:ci

      - name: Build shared backend
        run: >-
          docker build
          --file shared/Dockerfile.backend
          --tag asd-shared-backend:ci
          .

      - name: Validate Docker Compose
        run: docker compose config --quiet
