name: AWS Cloud Deployment
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'cloud/**'
      - 'shared/**'
      - 'student-*/**'
      - 'app.py'
      - 'requirements.txt'
      - '.github/workflows/**'
      - 'ai-services/**'
      - 'requirements-audit.txt'
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: aws-cloud-${{ github.ref }}
  cancel-in-progress: false
env:
  AI_MODE_ENABLED: "false"
  MCP_ENABLED: "false"
  RAG_ENABLED: "false"
  MULTI_AGENT_ENABLED: "false"
  RUN_LIVE_AI: "0"
  RUN_LIVE_MCP_AI: "0"
  RUN_LIVE_RAG_AI: "0"
  RUN_LIVE_VALIDATION: "0"
  RUN_LIVE_RELEASE1_VALIDATION: "0"
  RUN_LIVE_MULTI_AGENT: "0"
  RUN_NGINX_PROXY_CHECK: "0"
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - ['student-Chufeng/tests']
          - ['student-Ryan_Nolan/tests/inventory_tests.py', 'student-Ryan_Nolan/tests/mcp_route_test.py', 'student-Ryan_Nolan/tests/rag_route_test.py', 'student-Ryan_Nolan/tests/test_authentication.py']
          - ['student-Ethan Ting/tests']
          - ['student-Howard/tests']
          - ['student-Ethan Goldman/tests']
          - ['ai-services/multi_agent_server/tests']
          - ['shared/tests', 'cloud/tests', 'ai-services/mcp_server/tests', 'ai-services/rag_server/tests']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r ai-services/rag_server/requirements.txt
      - name: Validate assigned feature tests
        env:
          SUITE: ${{ toJSON(matrix.suite) }}
        run: |
          python - <<'PY'
          import json
          import os
          import pytest
          raise SystemExit(pytest.main([*json.loads(os.environ["SUITE"]), "-q", "--junitxml=results.xml"]))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ strategy.job-index }}
          path: results.xml
  cloud-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare and validate cloud build
        env:
          PUBLIC_ORIGIN: https://validation.cloudfront.net
          DATA_ROOT: /tmp/asd-cloud-data
          SESSION_SECRET: ci-only-session-secret # pragma: allowlist secret - Synthetic Compose build-validation value, never deployed.
          SEED_PASSWORD: CIOnlyGeneratedPassword1234567890 # pragma: allowlist secret - Synthetic Compose build-validation value, never deployed.
          ORIGIN_TOKEN: ci-only-origin-token
        run: |
          python3 cloud/prepare.py .cloud-build/ci
          docker compose --file .cloud-build/ci/cloud/compose.yml config --quiet
          docker compose --file .cloud-build/ci/cloud/compose.yml build
  student_workflows:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    outputs:
      current: ${{ steps.student_gate.outputs.current }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Require five exact-SHA main push workflows
        id: student_gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 cloud/check_workflows.py --sha "$GITHUB_SHA" --report .aws-deployment/workflow-gate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: student-workflow-gate-${{ github.sha }}-${{ github.run_attempt }}
          path: .aws-deployment/workflow-gate.json
          include-hidden-files: true
  deploy:
    needs: [validate, cloud-build, student_workflows]
    if: github.ref == 'refs/heads/main' && needs.student_workflows.outputs.current == 'true'
    runs-on: asd-main-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 60
    environment: aws-cloud
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Recheck that this candidate is still main
        id: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 cloud/check_workflows.py --sha "$GITHUB_SHA" --head-only --report .aws-deployment/deployment-candidate.json
      - name: Skip a superseded candidate
        if: steps.candidate.outputs.current == 'false'
        run: echo 'Candidate superseded; deploy the newer main release.'
      - name: Verify temporary CodeBuild credentials
        if: steps.candidate.outputs.current == 'true'
        run: aws sts get-caller-identity --region ap-southeast-2
      - name: Publish and deploy validated release
        if: steps.candidate.outputs.current == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.sha }}-${{ github.run_attempt }}
          STACK_NAME: ${{ vars.AWS_STACK_NAME || 'asd-release2' }}
        run: python3 cloud/deploy.py --stack "$STACK_NAME" --release "$RELEASE_ID" --report deployment-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aws-deployment-evidence
          include-hidden-files: true
          path: |
            .aws-deployment/deployment-candidate.json
            deployment-report.json
            deployment-evidence/*.json
