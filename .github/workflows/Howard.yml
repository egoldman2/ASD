name: Howard - Order & Returns

# Build and validate Howard's Order & Returns Management microservices

on:
  push:
    branches: [ main, howard-order-returns ]
    paths:
      - 'student-Howard/**'
      - '.github/workflows/Howard.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'student-Howard/**'
  workflow_dispatch:

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r student-Howard/backend/requirements.txt

      - name: Seed the database
        working-directory: student-Howard/database
        run: python seed.py

      - name: Verify database was seeded (10+ records per table)
        working-directory: student-Howard/database
        run: |
          python - <<'EOF'
          import sqlite3, sys
          conn = sqlite3.connect("orders.db")
          for table in ("orders", "order_items", "returns"):
              count = conn.execute(f"SELECT COUNT(*) FROM {table}").fetchone()[0]
              print(f"{table}: {count} records")
              if count < 10:
                  sys.exit(f"FAIL: {table} has fewer than 10 records")
          print("All tables have at least 10 records.")
          EOF

      - name: Smoke-test the Flask API
        working-directory: student-Howard/backend
        run: |
          python app.py &
          sleep 5
          curl --fail http://localhost:5001/orders || (echo "FAIL: /orders did not respond" && exit 1)
          echo "API responded successfully."

      - name: Build Docker image
        run: docker build -t howard-order-returns -f student-Howard/Dockerfile .