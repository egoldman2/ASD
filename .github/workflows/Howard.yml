name: Howard - Order & Returns

on:
  push:
    branches: [ main, howard-blueprint-integration, howard-release1-mcp ]
    paths:
      - 'student-Howard/**'
      - '.github/workflows/Howard.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'student-Howard/**'
  workflow_dispatch:

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    # Release 1: the MCP and RAG integration stays in the code, but both are
    # disabled during CI/CD so the build validates the feature without the
    # local MCP and RAG servers.
    env:
      MCP_ENABLED: "false"
      RAG_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-cors requests pytest

      - name: Confirm MCP and RAG are disabled for CI
        run: |
          echo "MCP_ENABLED=$MCP_ENABLED"
          echo "RAG_ENABLED=$RAG_ENABLED"

      - name: Seed the database
        working-directory: student-Howard/database
        run: python seed.py

      - name: Verify database has 10+ records per table
        working-directory: student-Howard/database
        run: |
          python - <<'PY'
          import sqlite3, sys
          conn = sqlite3.connect("orders.db")
          for table in ("orders", "order_items", "returns"):
              count = conn.execute(f"SELECT COUNT(*) FROM {table}").fetchone()[0]
              print(f"{table}: {count} records")
              if count < 10:
                  sys.exit(f"FAIL: {table} has fewer than 10 records")
          print("All tables have at least 10 records.")
          PY

      - name: Run pytest
        run: python -m pytest student-Howard/tests/ -q

      - name: Build Docker image
        run: docker build -t order-returns-frontend -f student-Howard/Dockerfile --target frontend .
