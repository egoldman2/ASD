name: Howard - Order & Returns

on:
  push:
    branches: [ main, howard-blueprint-integration ]
  pull_request:
    branches: [ main ]
    paths:
      - 'student-Howard/**'
      - 'shared/**'
      - '.github/workflows/Howard.yml'
  workflow_dispatch:

env:
  AI_MODE_ENABLED: "false"
  MCP_ENABLED: "false"
  RAG_ENABLED: "false"
  MULTI_AGENT_ENABLED: "false"
  RUN_LIVE_AI: "0"
  RUN_LIVE_MCP_AI: "0"
  RUN_LIVE_RAG_AI: "0"
  RUN_LIVE_VALIDATION: "0"
  RUN_LIVE_RELEASE1_VALIDATION: "0"
  RUN_LIVE_MULTI_AGENT: "0"
  RUN_NGINX_PROXY_CHECK: "0"

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-cors requests pytest

      - name: Seed the database
        working-directory: student-Howard/database
        run: python seed.py

      - name: Verify database has 10+ records per table
        working-directory: student-Howard/database
        run: |
          python - <<'PY'
          import sqlite3, sys
          conn = sqlite3.connect("orders.db")
          for table in ("orders", "order_items", "returns"):
              count = conn.execute(f"SELECT COUNT(*) FROM {table}").fetchone()[0]
              print(f"{table}: {count} records")
              if count < 10:
                  sys.exit(f"FAIL: {table} has fewer than 10 records")
          print("All tables have at least 10 records.")
          PY

      - name: Record and verify allocated endpoint functions
        env:
          ORDERS_DATABASE_PATH: ${{ runner.temp }}/orders-endpoint-tests.db
        run: python shared/endpoint_ci.py --feature order_returns --owner Howard

      - name: Run pytest
        run: python -m pytest student-Howard/tests/ -q

      - name: Build Docker image
        run: docker build -t order-returns-frontend -f student-Howard/Dockerfile --target frontend .

      - name: Upload endpoint and environment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: howard-release2-endpoints-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/
