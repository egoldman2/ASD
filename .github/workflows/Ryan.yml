name: Ryan Nolan - Inventory Management CI

on:
  push:
    branches:
      - main
      - Ryan_Nolan
    paths:
      - "student-Ryan_Nolan/**"
      - "student-Chufeng/database/**"
      - "shared/**"
      - "app.py"
      - "docker-compose.yml"
      - "requirements.txt"
      - ".github/workflows/RyanNolan.yml"
  pull_request:
    branches:
      - main
    paths:
      - "student-Ryan_Nolan/**"
      - "student-Chufeng/database/**"
      - "shared/**"
      - "app.py"
      - "docker-compose.yml"
      - "requirements.txt"
      - ".github/workflows/RyanNolan.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ryan-nolan-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Ryan Nolan inventory tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Initialise and verify the database
        run: |
          python "student-Ryan_Nolan/database/init_db.py"
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          db_path = Path("student-Ryan_Nolan/database/products.db")
          connection = sqlite3.connect(db_path)
          required_counts = {
              "products": 10,
              "suppliers": 10,
          }
          for table, minimum in required_counts.items():
              count = connection.execute(
                  f"SELECT COUNT(*) FROM {table}"
              ).fetchone()[0]
              print(f"{table}: {count} records")
              if count < minimum:
                  raise SystemExit(
                      f"{table} requires at least {minimum} records"
                  )
          PY

      - name: Run Ryan Nolan tests
        run: python -m pytest "student-Ryan_Nolan/tests" -q

      - name: Compile Ryan Nolan Python modules
        run: python -m compileall -q "student-Ryan_Nolan"

  docker-build:
    name: Build Ryan Nolan Docker images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build Inventory Management frontend
        run: |
          docker build --file "student-Ryan_Nolan/Dockerfile" --target frontend --tag asd-ryan-nolan-frontend:ci .

      - name: Build Inventory Management test image
        run: |
          docker build --file "student-Ryan_Nolan/Dockerfile" --target test --tag asd-ryan-nolan-test:ci .

      - name: Run tests in the Docker test container
        run: docker run --rm asd-ryan-nolan-test:ci