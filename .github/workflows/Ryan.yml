name: Ryan Nolan - Inventory Management CI

on:
  push:
    branches:
      - main
      - Ryan_Nolan
  pull_request:
    branches:
      - main
    paths:
      - "student-Ryan_Nolan/**"
      - "student-Chufeng/database/**"
      - "shared/**"
      - "app.py"
      - "docker-compose.yml"
      - "requirements.txt"
      - ".github/workflows/Ryan.yml"
  workflow_dispatch:

env:
  AI_MODE_ENABLED: "false"
  MCP_ENABLED: "false"
  RAG_ENABLED: "false"
  MULTI_AGENT_ENABLED: "false"
  RUN_LIVE_AI: "0"
  RUN_LIVE_MCP_AI: "0"
  RUN_LIVE_RAG_AI: "0"
  RUN_LIVE_VALIDATION: "0"
  RUN_LIVE_RELEASE1_VALIDATION: "0"
  RUN_LIVE_MULTI_AGENT: "0"
  RUN_NGINX_PROXY_CHECK: "0"

permissions:
  contents: read

concurrency:
  group: ryan-nolan-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Ryan Nolan inventory tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Initialise and verify the database
        run: |
          python "student-Ryan_Nolan/database/ryan_init_db.py"
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          db_path = Path("student-Ryan_Nolan/database/products.db")
          connection = sqlite3.connect(db_path)
          required_counts = {
              "products": 5,
              "suppliers": 5,
          }
          for table, minimum in required_counts.items():
              count = connection.execute(
                  f"SELECT COUNT(*) FROM {table}"
              ).fetchone()[0]
              print(f"{table}: {count} records")
              if count < minimum:
                  raise SystemExit(
                      f"{table} requires at least {minimum} records"
                  )
          PY

      - name: Record and verify allocated endpoint functions
        run: python shared/endpoint_ci.py --feature inventory --owner 'Ryan Nolan'

      - name: Run Ryan Nolan tests
        env:
          MCP_ENABLED: "false"
          RAG_ENABLED: "false"
        run: python -m pytest "student-Ryan_Nolan/tests/inventory_tests.py" "student-Ryan_Nolan/tests/mcp_route_test.py" "student-Ryan_Nolan/tests/rag_route_test.py" -q

      - name: Release 2 endpoint tests (2 endpoints)
        env:
          MCP_ENABLED: "false"
          RAG_ENABLED: "false"
        run: |
          mkdir -p test-results
          python -m pytest "student-Ryan_Nolan/tests/test_endpoints.py" -v \
            --junitxml=test-results/ryan-endpoint-tests.xml

      - name: Upload endpoint test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ryan-endpoint-test-report
          path: test-results/

      - name: Compile Ryan Nolan Python modules
        run: python -m compileall -q "student-Ryan_Nolan"

      - name: Upload endpoint and environment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ryan-release2-endpoints-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/

  docker-build:
    name: Build Ryan Nolan Docker images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build Inventory Management frontend
        run: |
          docker build --file "student-Ryan_Nolan/Dockerfile" --target frontend --tag asd-ryan-nolan-frontend:ci .

      - name: Build Inventory Management test image
        run: |
          docker build --file "student-Ryan_Nolan/Dockerfile" --target test --tag asd-ryan-nolan-test:ci .

      - name: Run tests in the Docker test container
        run: >-
          docker run --rm
          --env AI_MODE_ENABLED --env MCP_ENABLED --env RAG_ENABLED --env MULTI_AGENT_ENABLED
          --env RUN_LIVE_AI --env RUN_LIVE_MCP_AI --env RUN_LIVE_RAG_AI
          --env RUN_LIVE_VALIDATION --env RUN_LIVE_RELEASE1_VALIDATION
          --env RUN_LIVE_MULTI_AGENT --env RUN_NGINX_PROXY_CHECK
          asd-ryan-nolan-test:ci