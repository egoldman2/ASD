name: Ethan Ting - Customer Accounts and Loyalty CI

on:
  push:
    branches:
      - main
      - Ethan_Ting
    paths:
      - "student-Ethan Ting/**"
      - "shared/**"
      - "app.py"
      - "docker-compose.yml"
      - "requirements.txt"
      - ".github/workflows/EthanTing.yml"
  pull_request:
    branches:
      - main
    paths:
      - "student-Ethan Ting/**"
      - "shared/**"
      - "app.py"
      - "docker-compose.yml"
      - "requirements.txt"
      - ".github/workflows/EthanTing.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ethan-ting-customer-loyalty-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Ethan Ting customer accounts, loyalty and AI
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Initialise and verify the database
        env:
          DATABASE_PATH: /tmp/ethan-users.db
        run: |
          python "student-Ethan Ting/database/init_db.py"
          python - <<'PY'
          import os
          import sqlite3

          connection = sqlite3.connect(os.environ["DATABASE_PATH"])
          required_counts = {
              "users": 10,
              "loyalty_accounts": 10,
              "loyalty_transactions": 10,
          }
          for table, minimum in required_counts.items():
              count = connection.execute(
                  f"SELECT COUNT(*) FROM {table}"
              ).fetchone()[0]
              print(f"{table}: {count} records")
              if count < minimum:
                  raise SystemExit(
                      f"{table} requires at least {minimum} records"
                  )
          PY

      - name: Run Ethan Ting tests
        run: python -m pytest "student-Ethan Ting/tests" -q

      - name: Compile Ethan Ting Python modules
        run: python -m compileall -q "student-Ethan Ting"

  docker:
    name: Build and smoke-test Ethan Ting services
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build Ethan Ting containers
        run: |
          docker build --file "student-Ethan Ting/Dockerfile" --target frontend --tag asd-ethan-ting-frontend:ci .
          docker build --file "student-Ethan Ting/Dockerfile" --target backend --tag asd-ethan-ting-backend:ci .
          docker build --file "student-Ethan Ting/Dockerfile" --target database --tag asd-ethan-ting-database:ci .
          docker build --file "student-Ethan Ting/Dockerfile" --target test --tag asd-ethan-ting-test:ci .

      - name: Run tests in the Docker test container
        run: docker run --rm asd-ethan-ting-test:ci

      - name: Start Ethan Ting services
        run: docker compose up -d --build ethan-database ethan-backend ethan-frontend

      - name: Verify login, loyalty and role protection
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:6002/ready >/dev/null \
              && curl --fail --silent http://localhost:8003/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose ps
              exit 1
            fi
            sleep 2
          done

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://localhost:6002/api/profile)" = "401"

          curl --fail --silent --cookie-jar /tmp/ethan-ting-customer.cookies \
            --header "Content-Type: application/json" \
            --data '{"email":"customer@asd.local","password":"CustomerPass!2026"}' \
            http://localhost:6002/api/login >/dev/null

          curl --fail --silent --cookie /tmp/ethan-ting-customer.cookies \
            http://localhost:6002/api/profile \
            | grep -q 'customer@asd.local'

          curl --fail --silent --cookie /tmp/ethan-ting-customer.cookies \
            http://localhost:6002/api/loyalty \
            | grep -q '"points_balance":120'

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie /tmp/ethan-ting-customer.cookies \
            http://localhost:6002/api/admin/customers)" = "403"

          curl --fail --silent --cookie-jar /tmp/ethan-ting-admin.cookies \
            --header "Content-Type: application/json" \
            --data '{"email":"admin@asd.local","password":"AdminPass!2026"}' \
            http://localhost:6002/api/login >/dev/null

          curl --fail --silent --cookie /tmp/ethan-ting-admin.cookies \
            http://localhost:6002/api/admin/customers \
            | grep -q 'customer@asd.local'

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200 ethan-frontend ethan-backend ethan-database

      - name: Stop Ethan Ting services
        if: always()
        run: docker compose down --volumes
