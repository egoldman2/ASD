name: Chufeng Product Catalogue CI

on:
  push:
    branches:
      - Chufeng
    paths:
      - "student-Chufeng/**"
      - "ai-services/mcp_server/**"
      - "ai-services/rag_server/**"
      - "shared/**"
      - "app.py"
      - "docker-compose.yml"
      - "requirements.txt"
      - ".github/workflows/Chufeng.yml"
  pull_request:
    branches:
      - main
    paths:
      - "student-Chufeng/**"
      - "ai-services/mcp_server/**"
      - "ai-services/rag_server/**"
      - "shared/**"
      - "app.py"
      - "docker-compose.yml"
      - "requirements.txt"
      - ".github/workflows/Chufeng.yml"
  workflow_dispatch:

env:
  AI_MODE_ENABLED: "false"
  MCP_ENABLED: "false"
  RAG_ENABLED: "false"
  RUN_LIVE_AI: "0"

permissions:
  contents: read

concurrency:
  group: chufeng-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            ai-services/mcp_server/requirements.txt

      - name: Install dependencies
        run: >-
          python -m pip install
          -r requirements.txt
          -r ai-services/mcp_server/requirements.txt

      - name: Confirm local AI services are disabled in CI
        run: |
          test "$AI_MODE_ENABLED" = "false"
          test "$MCP_ENABLED" = "false"
          test "$RAG_ENABLED" = "false"
          test "$RUN_LIVE_AI" = "0"

      - name: Run Product Catalogue and MCP tests
        run: >-
          python -m pytest
          student-Chufeng/tests
          ai-services/mcp_server/tests
          -q

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose without starting local AI services
        run: docker compose config --quiet

      - name: Build Product Catalogue frontend
        run: >-
          docker build
          --file student-Chufeng/Dockerfile
          --target frontend
          --tag asd-product-catalogue:ci
          .

      - name: Build shared backend
        run: >-
          docker build
          --file shared/Dockerfile.backend
          --tag asd-shared-backend:ci
          .

      - name: Build Product Catalogue database
        run: >-
          docker build
          --file student-Chufeng/Dockerfile
          --target database
          --tag asd-product-database:ci
          .
