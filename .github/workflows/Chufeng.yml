name: Chufeng Product Catalogue CI

on:
  push:
    branches:
      - Chufeng
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: chufeng-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Product Catalogue tests
        run: python -m pytest student-Chufeng/tests -q

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Product Catalogue frontend
        run: >-
          docker build
          --file student-Chufeng/Dockerfile
          --target frontend
          --tag asd-product-catalogue:ci
          .

      - name: Build shared backend
        run: >-
          docker build
          --file shared/Dockerfile.backend
          --tag asd-shared-backend:ci
          .
