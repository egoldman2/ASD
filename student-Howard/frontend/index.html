<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order &amp; Returns Management</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="stylesheet" href="http://localhost:8000/css/styles.css?v=12">
    <script src="http://localhost:8000/js/site-header.js?v=4" defer></script>
    <script src="http://localhost:8000/js/account-menu.js?v=6" defer></script>
    <style>
        .featurePage {
            width: min(1200px, calc(100% - 4rem));
            margin: 0 auto;
            flex: 1 0 auto;
            padding: 2.5rem 0;
        }

        .featurePage h1 {
            color: #0b2545;
            font-size: clamp(2rem, 4vw, 3rem);
            margin-bottom: 0.5rem;
        }

        .featurePage h2 {
            color: #0b2545;
            margin: 2rem 0 1rem;
            font-size: 1.4rem;
        }

        .card {
            padding: 1.2rem;
            border: 1px solid #eef2f6;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 20px 25px -10px rgba(0, 40, 70, 0.10);
            margin-bottom: 1.5rem;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th,
        td {
            padding: 0.6rem 0.8rem;
            text-align: left;
            border-bottom: 1px solid #eef2f6;
        }

        th {
            color: #1d5b9e;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        td {
            color: #2c3e5c;
        }

        .actionBtn {
            cursor: pointer;
            padding: 0.5rem 1.1rem;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #0a2a44, #1d5b9e);
            color: #fff;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .actionBtn:hover {
            opacity: 0.85;
        }

        input {
            padding: 0.5rem 0.7rem;
            border: 1px solid #d7e4ef;
            border-radius: 8px;
            font-size: 0.95rem;
            margin-right: 0.5rem;
        }

        .ai-box {
            background: #f5f9ff;
            border: 1px solid #d7e4ef;
            padding: 1.2rem;
            border-radius: 12px;
            white-space: pre-wrap;
            color: #2c3e5c;
            line-height: 1.6;
            margin-top: 1rem;
        }
    </style>
</head>

<body>
    <header class="navbar appleNav" data-site-header data-active="account">
        <div class="navContainer">
            <div class="navLogo">
                <a href="http://localhost:8000" class="logoLink">
                    <span class="logoMain">ASD 2026</span>
                </a>
            </div>
            <nav class="navLinks" aria-label="Main navigation">
                <a href="http://localhost:8001" class="navLink">Product Catalogue</a>
                <a href="http://localhost:8002" class="navLink">Inventory Management</a>
                <a href="http://localhost:8003" class="navLink">Customer &amp; Loyalty</a>
                <a href="http://localhost:8005" class="navLink">Customer Support</a>
            </nav>
        </div>
    </header>

    <main class="featurePage">
        <h1>Order &amp; Returns Management</h1>

        <h2 id="orders">Orders</h2>
        <div class="card">
            <button class="actionBtn" hx-get="http://localhost:5000/api/order-returns/orders/html"
                hx-target="#orders-table">Load Orders</button>
            <div id="orders-table" style="margin-top:1rem;"></div>
        </div>

        <h2 id="returns">Returns</h2>
        <div class="card">
            <button class="actionBtn" hx-get="http://localhost:5000/api/order-returns/returns/html"
                hx-target="#returns-table">Load Returns</button>
            <div id="returns-table" style="margin-top:1rem;"></div>
        </div>

        <h2>AI Return Advice</h2>
        <div class="card">
            <input type="number" id="ret-id" placeholder="Return ID" min="1">
            <button class="actionBtn" onclick="getAdvice()">Ask AI</button>
            <div id="advice" class="ai-box"></div>
        </div>
    </main>

    <footer class="footer">
        ASD 2026 &mdash; Order &amp; Returns Management (Howard)
    </footer>

    <script>
        function getAdvice() {
            const id = document.getElementById('ret-id').value;
            fetch(`http://localhost:5000/api/order-returns/returns/${id}/advice`)
                .then(r => r.json())
                .then(d => {
                    document.getElementById('advice').textContent =
                        d.ai_summary || d.error || 'No response';
                });
        }
    </script>
</body>

</html>
