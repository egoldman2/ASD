<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login | ASD 2026</title>
<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    background: #f4f5f7;
  }
  .loginBox {
    background: #fff;
    padding: 2rem 2.5rem;
    border-radius: 8px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    max-width: 340px;
    width: 100%;
    text-align: center;
  }
  .loginBox h1 {
    font-size: 1.25rem;
    margin-bottom: 0.5rem;
  }
  .loginBox p {
    color: #555;
    font-size: 0.9rem;
    margin-bottom: 1.5rem;
  }
  .loginBox a {
    display: inline-block;
    padding: 0.6rem 1.4rem;
    background: #2563eb;
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    font-weight: 600;
  }
  .loginBox a:hover {
    background: #1d4ed8;
  }
</style>
</head>
<body>
  <div class="loginBox">
    <h1>Admin sign-in required</h1>
    <p>You need to be signed in as an administrator to view this page.</p>
    <a href="http://localhost:8003">Go to sign in</a>
  </div>
</body>
</html>
