<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product Catalogue | ASD 2026</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/styles.css?v=9">
    <script src="js/products.js?v=9" defer></script>
  </head>
  <body>
    <header class="navbar">
      <div class="navContainer">
        <div class="navLogo">
          <a href="http://localhost:8000" class="logoLink">
            <span class="logoMain">ASD 2026</span>
          </a>
        </div>

        <nav class="navLinks" aria-label="Main navigation">
          <a href="index.html" class="navLink active">Product Catalogue</a>
          <a href="http://localhost:8002" class="navLink">Inventory Management</a>
          <a href="http://localhost:8003" class="navLink">Customer & Loyalty</a>
          <a href="http://localhost:8004" class="navLink">Order & Returns</a>
          <a href="http://localhost:8005" class="navLink">Customer Support</a>
        </nav>
      </div>
    </header>

    <main class="cataloguePage">
      <section class="catalogueHero">
        <div>
          <p class="sectionEyebrow">Product Catalogue</p>
          <h1>Discover products for smarter shopping</h1>
        </div>
      </section>

      <section class="productSection" aria-label="Featured products">
        <div class="sectionHeader">
          <h2>Featured Products</h2>
          <a class="cartLink" href="cart.html">My Cart</a>
        </div>
        <form id="searchForm" class="productSearch" role="search">
          <label for="searchInput" class="visuallyHidden">Search products by name</label>
          <input
            id="searchInput"
            class="searchInput"
            type="search"
            name="search"
            placeholder="Search by product name"
            autocomplete="off"
          >
          <button class="searchButton" type="submit">Search</button>
        </form>

        <section class="aiMode" aria-labelledby="aiModeTitle">
          <div class="aiModeHeader">
            <p class="sectionEyebrow">AI Mode</p>
            <h3 id="aiModeTitle">AI Product Assistant</h3>
          </div>
          <form id="aiForm" class="aiForm">
            <div class="aiField">
              <label for="aiQuestion">Your product question</label>
              <textarea id="aiQuestion" name="message" rows="3" maxlength="500">I have a $500 budget. Can you recommend a combination of electronic products?</textarea>
            </div>
            <button id="askAiButton" class="askAiButton" type="submit">Ask AI</button>
          </form>
          <div class="aiField aiResponseField">
            <label for="aiOutput">AI response</label>
            <textarea
              id="aiOutput"
              rows="5"
              placeholder="The AI response will appear here."
              aria-live="polite"
              readonly
            ></textarea>
          </div>
        </section>

        <p id="catalogueNotice" class="catalogueNotice" aria-live="polite" hidden></p>
        <div id="productGrid" class="productGrid" aria-live="polite">
          <p class="productMessage">Loading products...</p>
        </div>
      </section>
    </main>

    <footer class="footer">
      asd(2026)-group7
    </footer>
  </body>
</html>
