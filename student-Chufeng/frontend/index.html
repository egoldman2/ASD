<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product Catalogue | ASD 2026</title>
    <link rel="stylesheet" href="css/styles.css?v=7">
    <script src="js/products.js?v=7" defer></script>
  </head>
  <body>
    <header class="navbar">
      <div class="navContainer">
        <div class="navLogo">
          <a href="http://localhost:8000" class="logoLink">
            <span class="logoMain">ASD 2026</span>
          </a>
        </div>

        <nav class="navLinks" aria-label="Main navigation">
          <a href="index.html" class="navLink active">Product Catalogue</a>
          <a href="http://localhost:8002" class="navLink">Inventory Management</a>
          <a href="http://localhost:8003" class="navLink">Customer & Loyalty</a>
          <a href="http://localhost:8004" class="navLink">Order & Returns</a>
          <a href="http://localhost:8005" class="navLink">Customer Support</a>
        </nav>
      </div>
    </header>

    <main class="cataloguePage">
      <section class="catalogueHero">
        <div>
          <p class="sectionEyebrow">Product Catalogue</p>
          <h1>Discover products for smarter shopping</h1>
        </div>
      </section>

      <section class="productSection" aria-label="Featured products">
        <div class="sectionHeader">
          <h2>Featured Products</h2>
          <button
            id="toggleProductFormButton"
            class="addProductButton"
            type="button"
            aria-expanded="false"
            aria-controls="addProductForm"
          >
            Add Product
          </button>
        </div>
        <form id="searchForm" class="productSearch" role="search">
          <label for="searchInput" class="visuallyHidden">Search products by name</label>
          <input
            id="searchInput"
            class="searchInput"
            type="search"
            name="search"
            placeholder="Search by product name"
            autocomplete="off"
          >
          <button class="searchButton" type="submit">Search</button>
        </form>
        <form id="addProductForm" class="addProductForm" novalidate hidden>
          <div class="formHeader">
            <h3 id="productFormTitle">Add Product</h3>
          </div>
          <div class="formGrid">
            <label class="formField">
              <span>Product name</span>
              <input type="text" name="name" required maxlength="100">
            </label>
            <label class="formField">
              <span>Category</span>
              <select name="category" required>
                <option value="">Select a category</option>
                <option value="Accessories">Accessories</option>
                <option value="Electronics">Electronics</option>
                <option value="Smart Home">Smart Home</option>
                <option value="Wearables">Wearables</option>
              </select>
            </label>
            <label class="formField">
              <span>Price (AUD)</span>
              <input type="number" name="price" min="0" step="0.01" required>
            </label>
            <label class="formField">
              <span>Stock quantity</span>
              <input type="number" name="stock_quantity" min="0" step="1" required>
            </label>
            <label class="formField formField--full">
              <span>Description</span>
              <textarea name="description" rows="4" maxlength="500"></textarea>
            </label>
          </div>
          <p id="formMessage" class="formMessage" aria-live="polite"></p>
          <div class="formActions">
            <button id="cancelProductButton" class="secondaryButton" type="button">Cancel</button>
            <button id="submitProductButton" class="primaryButton" type="submit">Create Product</button>
          </div>
        </form>
        <p id="catalogueNotice" class="catalogueNotice" aria-live="polite" hidden></p>
        <div id="productGrid" class="productGrid" aria-live="polite">
          <p class="productMessage">Loading products...</p>
        </div>
      </section>
    </main>

    <footer class="footer">
      asd(2026)-group7
    </footer>
  </body>
</html>
