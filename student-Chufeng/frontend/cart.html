<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Cart | ASD 2026</title>
    <link rel="stylesheet" href="css/styles.css?v=8">
    <script src="js/cart.js?v=1" defer></script>
  </head>
  <body>
    <header class="navbar">
      <div class="navContainer">
        <div class="navLogo">
          <a href="http://localhost:8000" class="logoLink">
            <span class="logoMain">ASD 2026</span>
          </a>
        </div>

        <nav class="navLinks" aria-label="Main navigation">
          <a href="index.html" class="navLink active">Product Catalogue</a>
          <a href="http://localhost:8002" class="navLink">Inventory Management</a>
          <a href="http://localhost:8003" class="navLink">Customer & Loyalty</a>
          <a href="http://localhost:8004" class="navLink">Order & Returns</a>
          <a href="http://localhost:8005" class="navLink">Customer Support</a>
        </nav>
      </div>
    </header>

    <main class="cataloguePage">
      <section class="catalogueHero catalogueHero--compact">
        <div>
          <p class="sectionEyebrow">Product Catalogue</p>
          <h1>My Cart</h1>
        </div>
      </section>

      <section class="productSection" aria-label="Shopping cart">
        <div class="sectionHeader">
          <h2>Cart Items</h2>
          <a class="cartLink cartLink--secondary" href="index.html">Continue Shopping</a>
        </div>
        <p id="cartNotice" class="catalogueNotice" aria-live="polite" hidden></p>
        <div id="cartGrid" class="productGrid" aria-live="polite">
          <p class="productMessage">Loading your cart...</p>
        </div>
        <section id="cartSummary" class="cartSummary" aria-label="Cart total" hidden>
          <span id="cartItemCount">0 items</span>
          <strong id="cartTotal">Total: $0.00</strong>
        </section>
      </section>
    </main>

    <footer class="footer">
      asd(2026)-group7
    </footer>
  </body>
</html>
