services:
  shared-home:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./shared:/usr/share/nginx/html:ro

  product-catalogue:
    build:
      context: .
      dockerfile: student-Chufeng/Dockerfile
      target: frontend
    ports:
      - "8001:80"
    depends_on:
      - shared-backend

  shared-backend:
    build:
      context: .
      dockerfile: shared/Dockerfile.backend
    ports:
      - "5000:5000"
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:0.5b
    volumes:
      - ./student-Chufeng/database:/app/student-Chufeng/database
      - ./student-Ethan Goldman/database:/app/student-Ethan Goldman/database

  ethan-frontend:
    build:
      context: .
      dockerfile: student-Ethan Ting/Dockerfile
      target: frontend
    ports:
      - "8003:80"
    depends_on:
      - ethan-backend

  ethan-backend:
    build:
      context: .
      dockerfile: student-Ethan Ting/Dockerfile
      target: backend
    ports:
      - "6002:6002"
    environment:
      DATABASE_API_URL: http://ethan-database:6003
      SESSION_SECRET: ${ETHAN_SESSION_SECRET:-release-0-local-secret}
    depends_on:
      - ethan-database

  ethan-database:
    build:
      context: .
      dockerfile: student-Ethan Ting/Dockerfile
      target: database
    expose:
      - "6003"
    environment:
      DATABASE_PATH: /data/users.db
    volumes:
      - ethan-user-data:/data

  order-returns-frontend:
    build:
      context: .
      dockerfile: student-Howard/Dockerfile
      target: frontend
    ports:
      - "8004:80"

  customer-support:
    build:
      context: .
      dockerfile: student-Ethan Goldman/Dockerfile
      target: frontend
    ports:
      - "8005:80"
