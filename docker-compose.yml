services:
  shared-home:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./shared:/usr/share/nginx/html:ro

  product-catalogue:
    build:
      context: .
      dockerfile: student-Chufeng/Dockerfile
      target: frontend
    ports:
      - "8001:80"
    depends_on:
      - shared-backend

  shared-backend:
    build:
      context: .
      dockerfile: shared/Dockerfile.backend
    ports:
      - "5000:5000"
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:0.5b
    volumes:
      - ./student-Chufeng/database:/app/student-Chufeng/database

  order-returns-backend:
    build:
      context: .
      dockerfile: student-Howard/Dockerfile
    ports:
      - "5003:5001"
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:0.5b
    extra_hosts:
      - "host.docker.internal:host-gateway"
