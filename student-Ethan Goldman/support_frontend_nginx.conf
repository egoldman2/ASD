worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        location = /health {
            default_type text/plain;
            return 200 "customer-support-frontend\n";
        }

        location = / {
            proxy_pass http://customer-support-backend:6005/api/support/ui/entry;
            proxy_set_header Cookie $http_cookie;
        }

        location = /index.html {
            return 302 /;
        }

        location = /customer.html {
            auth_request /api/support/ui/access/customer;
            error_page 401 403 = /;
            try_files $uri =404;
        }

        location = /staff.html {
            auth_request /api/support/ui/access/admin;
            error_page 401 403 = /;
            try_files $uri =404;
        }

        location = /staff-ticket.html {
            auth_request /api/support/ui/access/admin;
            error_page 401 403 = /;
            try_files $uri =404;
        }

        location /api/ {
            proxy_pass http://customer-support-backend:6005;
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 100s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
