<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Customer Support staff ticket queue for ASD 2026.">
  <title>Support Tickets | ASD 2026</title>
  <link rel="stylesheet" href="http://localhost:8000/css/styles.css?v=2">
  <link rel="stylesheet" href="css/support.css?v=3">
  <script src="js/htmx.min.js" defer></script>
  <script src="js/support.js?v=3" defer></script>
</head>

<body>
  <header class="navbar">
    <div class="navContainer">
      <div class="navLogo"><a href="http://localhost:8000" class="logoLink" aria-label="ASD 2026 home"><span
            class="logoMain">ASD 2026</span></a></div>
      <nav class="navLinks" aria-label="Main navigation"><a href="http://localhost:8001" class="navLink">Product
          Catalogue</a><a href="http://localhost:8002" class="navLink">Inventory Management</a><a
          href="http://localhost:8003" class="navLink">Customer &amp; Loyalty</a><a href="http://localhost:8004"
          class="navLink">Order &amp; Returns</a><a href="http://localhost:8005"
          class="navLink navLink--active" aria-current="page">Customer Support</a></nav>
    </div>
  </header>
  <main class="supportPage">
    <nav class="supportNav" aria-label="Customer Support"><a href="index.html">Overview</a><a
        href="customer.html">Customer</a><a href="staff.html" aria-current="page">Staff</a></nav>
    <header class="pageHeader">
      <h1 id="page-title">Support tickets</h1>
      <p>Search, filter, and open a ticket from the queue.</p>
    </header>
    <section class="panel queuePanel" aria-label="All support tickets">
      <div id="ticket-list-region" aria-live="polite" hx-get="http://localhost:5000/support-ui/staff/tickets"
        hx-trigger="load" hx-swap="innerHTML">
        <p class="loadingText">Loading tickets…</p>
      </div>
    </section>
  </main>
  <footer class="footer">ASD 2026 &mdash; Customer Support Ticket Management</footer>
</body>

</html>
